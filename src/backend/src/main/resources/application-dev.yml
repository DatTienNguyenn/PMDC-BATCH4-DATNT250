spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carbon_ledger}
    username: ${DB_USER:carbon_admin}
    password: ${DB_PASSWORD:carbon_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

logging:
  level:
    root: INFO
    com.carbonledger.backend: DEBUG
    org.springframework.security: INFO
