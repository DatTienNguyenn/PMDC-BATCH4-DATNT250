<!-- Main Content Canvas -->

<h1 class="text-headline-lg font-headline-lg text-on-surface tracking-tight">Settings</h1>
<!-- Tab Pills -->
<div class="flex items-center gap-2">
<!-- Active Tab: Workspace -->
<button class="px-4 py-1.5 rounded-xl font-label-lg text-label-lg text-white shadow-sm transition-all duration-150" style="background-color: #00A76F;" type="button">
              Workspace

              Budget

<button class="px-4 py-1.5 rounded-xl font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface bg-surface-container-lowest border border-outline-variant/30 hover:border-outline-variant transition-all duration-150" type="button">
              Members

<!-- 1. Workspace Name -->
<div class="space-y-2">
<label class="block font-label-lg text-label-lg text-on-surface" for="workspace-name">
                Workspace Name
              </label>
<div class="relative">
<input class="w-full h-12 px-3.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg border border-outline-variant/40 focus:outline-none focus:border-[#00A76F] focus:ring-2 focus:ring-[#00A76F]/20 transition-all duration-150" id="workspace-name" name="workspace-name" required="" type="text" value="My Home"/>
</div>
</div>
<!-- 2. Type: Radio Selection -->
<div class="space-y-2.5">
<label class="block font-label-lg text-label-lg text-on-surface">
                Type
              </label>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
<!-- Household Option (Checked) -->
<label class="relative flex items-center p-3.5 rounded-xl border border-[#00A76F] bg-surface-container-low/40 cursor-pointer transition-all duration-150 select-none">
<input checked="" class="w-4 h-4 text-[#00A76F] border-outline-variant focus:ring-[#00A76F] focus:ring-offset-0 transition-colors" name="workspace-type" type="radio" value="household"/>
<div class="ml-3 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-on-surface" data-icon="home">home</span>
<span class="font-label-lg text-label-lg text-on-surface">Household</span>
</div>
</label>

<input class="w-4 h-4 text-[#00A76F] border-outline-variant focus:ring-[#00A76F] focus:ring-offset-0 transition-colors" name="workspace-type" type="radio" value="small_office"/>
<div class="ml-3 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant" data-icon="corporate_fare">corporate_fare</span>
<span class="font-label-lg text-label-lg text-on-surface-variant">Small Office</span>
</div>
</label>

                  Floor Area

<div class="absolute right-2.5 px-2.5 py-1 rounded bg-surface-container-low text-on-surface-variant font-label-md text-label-md select-none border border-outline-variant/30">
                    m²
                  </div>
</div>
</div>
<!-- 4. Members Count -->
<div class="space-y-2">
<label class="block font-label-lg text-label-lg text-on-surface" for="members-count">
                  Members Count

<input class="w-full h-12 px-3.5 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg border border-outline-variant/40 focus:outline-none focus:border-[#00A76F] focus:ring-2 focus:ring-[#00A76F]/20 transition-all duration-150" id="members-count" min="1" name="members-count" type="number" value="4"/>
</div>
</div>

<div class="pt-2 border-t border-outline-variant/20"></div>

<div class="flex justify-end items-center pt-1">
<button class="px-6 py-2.5 rounded-xl font-label-lg text-label-lg text-white font-medium shadow-sm hover:shadow transition-all duration-150 active:scale-[0.99] flex items-center gap-2" style="background-color: #00A76F;" type="submit">
<span>Save Changes</span>
</button>
</div>

</main>
</div>
<!-- Micro-interaction script for dynamic form feedback -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('workspace-form');
      const radioLabels = document.querySelectorAll('input[name="workspace-type"]');

      radioLabels.forEach(radio => {
        radio.addEventListener('change', () => {
          radioLabels.forEach(r => {
            const parentLabel = r.closest('label');
            const icon = parentLabel.querySelector('.material-symbols-outlined');
            const labelText = parentLabel.querySelector('span:last-child');
            if (r.checked) {
              parentLabel.classList.add('border-[#00A76F]', 'bg-surface-container-low/40');
              parentLabel.classList.remove('border-outline-variant/30', 'bg-surface-container-lowest');
              icon.classList.remove('text-on-surface-variant');
              icon.classList.add('text-on-surface');
              labelText.classList.remove('text-on-surface-variant');
              labelText.classList.add('text-on-surface');
            } else {
              parentLabel.classList.remove('border-[#00A76F]', 'bg-surface-container-low/40');
              parentLabel.classList.add('border-outline-variant/30', 'bg-surface-container-lowest');
              icon.classList.add('text-on-surface-variant');
              icon.classList.remove('text-on-surface');
              labelText.classList.add('text-on-surface-variant');
              labelText.classList.remove('text-on-surface');
            }
          });
        });
      });
    });
  </script>
