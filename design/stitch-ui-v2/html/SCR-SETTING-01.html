<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cài đặt không gian - CarbonLedger</title>
<!-- Material Symbols Outlined font -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Public Sans Google Font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS Play CDN with forms & container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container-low": "#eef4ff",
            "surface-variant": "#d9e3f2",
            "surface-container": "#e4effe",
            "primary-container": "#00a76f",
            "outline-variant": "#bccabf",
            "surface-container-lowest": "#ffffff",
            "primary": "#006c46",
            "on-surface": "#121c27",
            "outline": "#6d7a71",
            "background": "#F9FAFB"
          },
          "fontFamily": {
            "body-md": ["Public Sans"],
            "title": ["Public Sans"]
          }
        },
      },
    }
  </script>
</head>
<body class="bg-[#F9FAFB] text-on-surface antialiased min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-white">
<!-- TopNavBar (Web Header) -->
<header class="fixed top-0 left-0 right-0 z-40 flex justify-between items-center px-6 h-16 w-full border-b border-outline-variant/30 bg-surface-container-lowest shadow-sm">
<!-- Brand Anchor Logo & Breadcrumb -->
<div class="flex items-center gap-4">
  <div class="text-title font-title font-bold text-on-surface flex items-center gap-2">
    <span class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center text-white shadow-sm" style="background-color: #00A76F;">
      <span class="material-symbols-outlined text-[20px]" data-icon="eco" style="font-variation-settings: 'FILL' 1;">eco</span>
    </span>
    <span class="tracking-tight text-on-surface font-bold">CarbonLedger</span>
  </div>
  <div class="h-4 w-px bg-outline-variant/40 hidden sm:block"></div>
  <div class="hidden sm:flex items-center text-[13px] font-medium text-outline">
    <span class="hover:text-on-surface cursor-pointer">Gia Đình Xanh</span>
    <span class="mx-2 text-outline-variant">/</span>
    <span class="text-on-surface font-semibold">Cài đặt</span>
  </div>
</div>
<!-- Trailing Actions: Notifications & Avatar -->
<div class="flex items-center gap-4">
<button aria-label="Thông báo" class="relative p-2 rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors duration-150" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="notifications">notifications</span>
<!-- Notification indicator badge -->
<span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-red-500 ring-2 ring-surface-container-lowest"></span>
</button>
<div class="flex items-center gap-3 pl-2 border-l border-outline-variant/30">
<div class="w-9 h-9 rounded-full bg-[#00A76F] text-white flex items-center justify-center font-bold text-[13px] shadow-sm">
  NA
</div>
</div>
</div>
</header>
<div class="flex pt-16 min-h-screen">
<!-- SideNavBar (Shared Component) -->
<aside class="fixed left-0 top-16 bottom-0 w-56 flex flex-col py-6 px-3 bg-white border-r border-gray-200 select-none z-30">
<nav class="space-y-1.5 flex-1">
<!-- 1. Tong quan -->
<a class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-600 hover:text-gray-900 hover:bg-gray-100 font-medium text-sm transition-all duration-150" href="#">
<span class="material-symbols-outlined text-[20px]">dashboard</span>
<span>Tổng quan</span>
</a>
<!-- 2. So cai -->
<a class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-600 hover:text-gray-900 hover:bg-gray-100 font-medium text-sm transition-all duration-150" href="#">
<span class="material-symbols-outlined text-[20px]">receipt_long</span>
<span>Sổ cái</span>
</a>
<!-- 3. Phe duyet -->
<a class="flex items-center justify-between px-3 py-2.5 rounded-xl text-gray-600 hover:text-gray-900 hover:bg-gray-100 font-medium text-sm transition-all duration-150" href="#">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[20px]">verified</span>
<span>Phê duyệt</span>
</div>
<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200">5 chờ</span>
</a>
<!-- 4. Bao cao & Lo trinh -->
<a class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-600 hover:text-gray-900 hover:bg-gray-100 font-medium text-sm transition-all duration-150" href="#">
<span class="material-symbols-outlined text-[20px]">insights</span>
<span>Báo cáo &amp; Lộ trình</span>
</a>
<!-- 5. Cai dat (ACTIVE) -->
<a class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-[#00A76F] text-white font-semibold text-sm shadow-sm transition-all duration-150" href="#">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">settings</span>
<span>Cài đặt</span>
</a>
</nav>

<!-- Sidebar Footer: Version & Status -->
<div class="px-3 pt-4 border-t border-gray-200 flex items-center justify-between text-xs text-gray-400">
<span>v2.4.0</span>
<span class="w-2 h-2 rounded-full bg-[#00A76F]"></span>
</div>
</aside>
<!-- Main Content Canvas -->
<main class="flex-1 ml-56 p-8 md:p-10 max-w-7xl">
<div class="max-w-3xl space-y-6">
<!-- Header Section -->
<div class="space-y-4">
<h1 class="text-2xl font-bold text-on-surface tracking-tight">Cài đặt</h1>
<!-- Tab Pills -->
<div class="flex items-center gap-2">
<!-- Active Tab: Workspace -->
<button class="px-4 py-1.5 rounded-xl text-sm font-semibold text-white shadow-sm transition-all duration-150 bg-[#00A76F]" type="button">
  Không gian
</button>
<!-- Inactive Tab: Budget -->
<button class="px-4 py-1.5 rounded-xl text-sm font-medium text-gray-600 hover:text-gray-900 bg-white border border-outline-variant/30 hover:border-outline-variant transition-all duration-150" type="button">
  Ngân sách
</button>
<!-- Inactive Tab: Members -->
<button class="px-4 py-1.5 rounded-xl text-sm font-medium text-gray-600 hover:text-gray-900 bg-white border border-outline-variant/30 hover:border-outline-variant transition-all duration-150" type="button">
  Thành viên
</button>
</div>
</div>
<!-- TAB: Workspace Form Card -->
<div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/20 shadow-sm p-8 transition-shadow duration-200">
<form class="space-y-6" id="workspace-form" onsubmit="event.preventDefault();">
<!-- 1. Workspace Name -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface" for="workspace-name">
  Tên không gian làm việc
</label>
<div class="relative">
<input class="w-full h-12 px-3.5 bg-surface-container-lowest text-on-surface text-sm rounded-lg border border-outline-variant/40 focus:outline-none focus:border-[#00A76F] focus:ring-2 focus:ring-[#00A76F]/20 transition-all duration-150" id="workspace-name" name="workspace-name" required="" type="text" value="Gia Đình Xanh"/>
</div>
</div>
<!-- 2. Type: Radio Selection -->
<div class="space-y-2.5">
<label class="block text-sm font-semibold text-on-surface">
  Loại hình
</label>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
<!-- Household Option (Checked) -->
<label class="relative flex items-center p-3.5 rounded-xl border border-[#00A76F] bg-[#00A76F]/[0.04] cursor-pointer transition-all duration-150 select-none">
<input checked="" class="w-4 h-4 text-[#00A76F] border-outline-variant focus:ring-[#00A76F] focus:ring-offset-0 transition-colors" name="workspace-type" type="radio" value="household"/>
<div class="ml-3 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-on-surface" data-icon="home">home</span>
<span class="text-sm font-semibold text-on-surface">Hộ gia đình</span>
</div>
</label>
<!-- Small Office Option -->
<label class="relative flex items-center p-3.5 rounded-xl border border-outline-variant/30 hover:border-outline-variant bg-surface-container-lowest cursor-pointer transition-all duration-150 select-none">
<input class="w-4 h-4 text-[#00A76F] border-outline-variant focus:ring-[#00A76F] focus:ring-offset-0 transition-colors" name="workspace-type" type="radio" value="small_office"/>
<div class="ml-3 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px] text-gray-500" data-icon="corporate_fare">corporate_fare</span>
<span class="text-sm font-medium text-gray-600">Văn phòng nhỏ</span>
</div>
</label>
</div>
</div>
<!-- 3 & 4. Grid with Floor Area and Members Count -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
<!-- 3. Floor Area (with m² suffix badge) -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface" for="floor-area">
  Diện tích sàn
</label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-3.5 pr-14 bg-surface-container-lowest text-on-surface text-sm rounded-lg border border-outline-variant/40 focus:outline-none focus:border-[#00A76F] focus:ring-2 focus:ring-[#00A76F]/20 transition-all duration-150" id="floor-area" min="1" name="floor-area" type="number" value="85"/>
<div class="absolute right-2.5 px-2.5 py-1 rounded bg-gray-100 text-gray-600 text-xs font-semibold select-none border border-outline-variant/30">
  m²
</div>
</div>
</div>
<!-- 4. Members Count -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface" for="members-count">
  Số lượng thành viên
</label>
<div class="relative">
<input class="w-full h-12 px-3.5 bg-surface-container-lowest text-on-surface text-sm rounded-lg border border-outline-variant/40 focus:outline-none focus:border-[#00A76F] focus:ring-2 focus:ring-[#00A76F]/20 transition-all duration-150" id="members-count" min="1" name="members-count" type="number" value="4"/>
</div>
</div>
</div>
<!-- Divider -->
<div class="pt-2 border-t border-outline-variant/20"></div>
<!-- 5. Action Button (Right-aligned Save Changes) -->
<div class="flex justify-end items-center pt-1">
<button class="px-6 py-2.5 rounded-xl text-sm text-white font-semibold shadow-sm hover:shadow transition-all duration-150 active:scale-[0.99] flex items-center gap-2 bg-[#00A76F] hover:bg-[#009160]" type="submit">
<span>Lưu thay đổi</span>
</button>
</div>
</form>
</div>
</div>
</main>
</div>
<!-- Micro-interaction script for dynamic form feedback -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const radioLabels = document.querySelectorAll('input[name="workspace-type"]');

      radioLabels.forEach(radio => {
        radio.addEventListener('change', () => {
          radioLabels.forEach(r => {
            const parentLabel = r.closest('label');
            const icon = parentLabel.querySelector('.material-symbols-outlined');
            const labelText = parentLabel.querySelector('span:last-child');
            if (r.checked) {
              parentLabel.classList.add('border-[#00A76F]', 'bg-[#00A76F]/[0.04]');
              parentLabel.classList.remove('border-outline-variant/30', 'bg-surface-container-lowest');
              icon.classList.remove('text-gray-500');
              icon.classList.add('text-on-surface');
              labelText.classList.remove('text-gray-600', 'font-medium');
              labelText.classList.add('text-on-surface', 'font-semibold');
            } else {
              parentLabel.classList.remove('border-[#00A76F]', 'bg-[#00A76F]/[0.04]');
              parentLabel.classList.add('border-outline-variant/30', 'bg-surface-container-lowest');
              icon.classList.add('text-gray-500');
              icon.classList.remove('text-on-surface');
              labelText.classList.add('text-gray-600', 'font-medium');
              labelText.classList.remove('text-on-surface', 'font-semibold');
            }
          });
        });
      });
    });
  </script>
</body></html>
